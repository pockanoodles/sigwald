services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Production stage: standalone `next build` + `node server.js`. The dev
      # server compiled every route on demand, which made the UI feel laggy.
      target: production
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Inside the compose network, Postgres lives at its service hostname —
      # this overrides the host-oriented localhost value from .env.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sigwald}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-sigwald}
      # Next standalone binds this host; without it the server can bind
      # localhost-only inside the container and break the port mapping.
      - HOSTNAME=0.0.0.0
      # Explicit, because .env's empty SIGWALD_MATERIALS_DIR= would override the image.
      - SIGWALD_MATERIALS_DIR=/data/materials
    volumes:
      - materials:/data/materials
    depends_on:
      db:
        condition: service_healthy
    # Migrations run in this container's entrypoint, then `next dev` binds :3000.
    # Once the port is listening the schema is up — the worker gates on this.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # The sync worker: periodic Canvas, CalDAV, iCal, Google and Outlook sync for all eligible
  # users/feeds on a timer (src/lib/sigwald/sync-loop.ts). The same production
  # image as the app, which carries the worker as one bundled file. A separate
  # process so sync runs outside the web server; a single container can set
  # SIGWALD_SCHEDULER=inprocess and drop this service.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sigwald}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-sigwald}
      - SIGWALD_MATERIALS_DIR=/data/materials
    depends_on:
      db:
        condition: service_healthy
      # Wait for the app so migrations have applied before the worker queries.
      app:
        condition: service_healthy
    # Not the app's entrypoint (which runs migrate deploy): the app owns
    # migrations, and the worker waits for it above.
    entrypoint: ["node", "dist/worker/worker.js"]
    command: []
    volumes:
      - materials:/data/materials
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sigwald}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-sigwald}
    # Loopback only: reachable from this machine for `npm run dev` and Prisma,
    # not from the network. The app and worker reach it as `db` on the compose
    # network and do not need the published port.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # A database copy a day into ./backups, 14 kept (docker/backup.sh), so a
  # server keeps its own copies the way the desktop app does. They sit on the
  # same disk, so copy the folder elsewhere too. Same image as db, so pg_dump
  # matches the server's major version.
  backup:
    image: postgres:16-alpine
    environment:
      - PGHOST=db
      - PGUSER=${POSTGRES_USER:-sigwald}
      - PGPASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - PGDATABASE=${POSTGRES_DB:-sigwald}
      - SIGWALD_BACKUP_KEEP=${SIGWALD_BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped

volumes:
  postgres_dev_data:
  # Downloaded Canvas files, shared by the app (serves them) and the worker
  # (downloads them).
  materials:
